    <style>
        
/* 语法高亮样式 - 适配深色背景 */
.hljs-keyword {
  color: #c678dd !important;
}

  color: #98c379 !important;
}

.hljs-comment {
  color: #5c6370 !important;
  font-style: italic !important;
}

  color: #d19a66 !important;
}

.hljs-name {

  color: #61aeee !important;
}

.hljs-variable {
  color: #e06c75 !important;
}

.hljs-title {
  color: #61aeee !important;
}

/* 行内代码 */
code {
  color: #009688;
  background-color: #f0f8f8;
  padding: 2px 6px;

    <div id="nice">
        <h1>规模性</h1>
<p>可以说编程的本质，是控制复杂度。代码的规模的膨胀就是复杂度的最大根源。</p>
<pre><code class="language-python"><div style="background-color: #282c34; color: #abb2bf; padding: 16px; border-radius: 5px; margin: 10px 0; font-family: 'Courier New', Consolas, Monaco, monospace; font-size: 14px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; border: 1px solid #3e4451;">
                    <div style="margin: 0; padding: 0; line-height: 1.5; min-height: 21px;"><span class="hljs-keyword">def</span>&nbsp;<span class="hljs-title function_">hello</span>():</div><div style="margin: 0; padding: 0; line-height: 1.5; min-height: 21px;">&nbsp;&nbsp;&nbsp;&nbsp;<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;Hello,&nbsp;world!&quot;</span>)</div>
                </div>
</code></pre><p>这是一个简单的 Python 函数示例。</p>
<h2>其他语言示例</h2>
<pre><code class="language-javascript"><div style="background-color: #282c34; color: #abb2bf; padding: 16px; border-radius: 5px; margin: 10px 0; font-family: 'Courier New', Consolas, Monaco, monospace; font-size: 14px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; border: 1px solid #3e4451;">
                    <div style="margin: 0; padding: 0; line-height: 1.5; min-height: 21px;"><span class="hljs-keyword">function</span>&nbsp;<span class="hljs-title function_">greet</span>(<span class="hljs-params">name</span>)&nbsp;{</div><div style="margin: 0; padding: 0; line-height: 1.5; min-height: 21px;">&nbsp;&nbsp;&nbsp;&nbsp;<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Hello,&nbsp;<span class="hljs-subst">${name}</span>!`</span>);</div><div style="margin: 0; padding: 0; line-height: 1.5; min-height: 21px;">&nbsp;&nbsp;&nbsp;&nbsp;<span class="hljs-keyword">return</span>&nbsp;<span class="hljs-literal">true</span>;</div><div style="margin: 0; padding: 0; line-height: 1.5; min-height: 21px;">}</div>
                </div>
</code></pre><p>行内代码示例：<code>console.log()</code> 是 JavaScript 中的输出函数。</p>
